[general]
working_directory = "~"
import = [
  "~/.config/alacritty/gruvbox.toml"
]

[window]
opacity = 0.85
dynamic_padding = true


[colors.cursor]
# text = "#e0def4"
cursor = "#EC5D2A"

[font]
normal = { family = "ocr a std" }
size = 20

[keyboard]
bindings = [
    { key = ")", mods = "Control", mode = "AppCursor", action = "ResetFontSize" },
]
