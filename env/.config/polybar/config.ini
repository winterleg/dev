; =========================
; Polybar config (i3status / i3bar replica)
; =========================

[colors]
background = #191724
background-alt = #1f1d2e
foreground = #e0def4
separator = #26233a

focused = #31748f
active = #1f1d2e
inactive = #191724
inactive-fg = #908caa
urgent = #26233a
urgent-fg = #eb6f92

net-down = #7dcfff
net-up = #8be9fd

[bar/main]
monitor = HDMI-0
width = 100%
height = 22
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
radius-top = 0
radius-bottom = 0
padding-left = 0
padding-right = 0
module-margin = 1
separator = │
separator-foreground = ${colors.separator}
override-redirect = false

font-0 = Courier Prime:size=12;2
font-1 = Comic Code:size=12;2

modules-left = workspaces net_down net_up
modules-center =
modules-right = qbt_down qbt_up battery memory cpu time tray



enable-ipc = true

[bar/secondary]
monitor = DP-4
width = 100%
height = 22
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
radius-top = 0
radius-bottom = 0
padding-left = 0
padding-right = 0
module-margin = 1
separator = │
separator-foreground = ${colors.separator}
override-redirect = false

font-0 = Courier Prime:size=12;2
font-1 = Comic Code:size=12;2

modules-left = workspaces net_down net_up
modules-center =
modules-right = qbt_down qbt_up battery memory cpu time tray


enable-ipc = true

; -------------------------
; Modules
; -------------------------

[module/workspaces]
type = internal/xworkspaces

pin-workspaces = false
enable-click = true
enable-scroll = true

label-active = %name%
label-active-background = ${colors.focused}
label-active-foreground = ${colors.foreground}
label-active-padding = 1

label-occupied = %name%
label-occupied-background = ${colors.inactive}
label-occupied-foreground = ${colors.inactive-fg}
label-occupied-padding = 1

label-empty = %name%
label-empty-background = ${colors.inactive}
label-empty-foreground = ${colors.inactive-fg}
label-empty-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.urgent-fg}
label-urgent-padding = 1

[module/tray]
type = internal/tray
tray-background = ${colors.background}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 100
format-charging = <label-charging>
label-charging = Charging %percentage%%
format-discharging = <label-discharging>
label-discharging = Discharging %percentage%%
format-full = <label-full>
label-full = Full %percentage%%

[module/memory]
type = internal/memory
interval = 2
label = RAM %used% / %total%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/time]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M:%S
label = %date% %time%

[module/net_down]
type = custom/script
exec = python3 /home/fuyu147/.config/i3status/net_speed.py --one down
interval = 2
format = <label>
label = ↓↓ %output%
label-foreground = ${colors.net-down}

[module/net_up]
type = custom/script
exec = python3 /home/fuyu147/.config/i3status/net_speed.py --one up
interval = 2
format = <label>
label = ↑↑ %output%
label-foreground = ${colors.net-up}

[module/qbt_down]
type = custom/script
exec = python3 /home/fuyu147/.config/i3status/qbt_upload.py --one down
interval = 2
format = <label>
label = ↓ %output%
label-foreground = ${colors.net-down}

[module/qbt_up]
type = custom/script
exec = python3 /home/fuyu147/.config/i3status/qbt_upload.py --one up
interval = 2
format = <label>
label = ↑ %output%
label-foreground = ${colors.net-up}
