; =========================
; Polybar config (waybar monitorv3 replica)
; =========================

[colors]
background = #282828
background-alt = #3c3836
foreground = #faf4ed
active = #458588
inactive = #7c6f64

[bar/main]
monitor = HDMI-0
width = 100%
height = 24
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
radius-top = 0
radius-bottom = 0
padding-left = 0
padding-right = 0
module-margin = 0

font-0 = Comic Code:size=10;2

modules-left = workspaces
modules-center = clock volume
modules-right = tray

enable-ipc = true

tray-position = right
tray-padding = 4

[bar/secondary]
monitor = DP-4
width = 100%
height = 24
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
radius-top = 0
radius-bottom = 0
padding-left = 0
padding-right = 0
module-margin = 0

font-0 = Comic Code:size=10;2

modules-left = workspaces
modules-center = volume clock
modules-right =

enable-ipc = true

; -------------------------
; Modules
; -------------------------

[module/workspaces]
type = internal/xworkspaces

pin-workspaces = false
enable-click = true
enable-scroll = true

label-active = %name%
label-active-background = ${colors.active}
label-active-foreground = ${colors.foreground}
label-active-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-empty =

[module/tray]
type = internal/tray
tray-spacing = 6

[module/volume]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume = %percentage%%
format-muted = <label-muted>
label-muted = MUTED
label-volume-padding = 1

[module/clock]
type = internal/date
interval = 1
time = %H:%M
label = %time%
label-foreground = ${colors.foreground}
