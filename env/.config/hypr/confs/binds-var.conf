$mainMod = SUPER

# ==== WM ====
# bind = $mainMod, K,           exec, hyprctl kill
bind = $mainMod, C,           killactive,
bind = $mainMod, F8,          exit,
bind = $mainMod, escape,      exec, ~/.config/hypr/scripts/logout.sh
bind = $mainMod, L,           exec, hyprlock
bind = $mainMod, V,           togglefloating,
bind = $mainMod, J,           layoutmsg, togglesplit
bind = $mainMod, F,           fullscreen
bind = $mainMod, P,           pin
bind = $mainMod SHIFT, P,     movecurrentworkspacetomonitor, +1
bind = ALT, Tab,              cyclenext, prev
bind = ALT, Tab,              bringactivetotop
bind = $mainMod, P,           pseudo
bind = $mainMod, TAB,         workspace, previous
bind = $mainMod, B,           exec, ~/.config/waybar/waybar.sh
bind = $mainMod, F11,         exec, pkill hyprsunset || hyprsunset -t 4000
bind = $mainMod, F12,         exec, dunstctl history-pop

# ==== Apps/Scripts ====
bind = $mainMod, minus,       exec,  ~/dotfiles/scripts/yazi-neovide
bind = $mainMod CONTROL, V,   exec,  cliphist list | rofi -config ~/.config/rofi/config-copy.rasi -dmenu -p "Clipboard" | cliphist decode | wl-copy
bind = $mainMod, Q,           exec,  helium-browser
bind = $mainMod, RETURN,      exec,  ghostty
bind = $mainMod SHIFT, RETURN,exec,  alacritty
bind = $mainMod, W,           exec,  ~/.config/hypr/scripts/open-if-not.sh firefox
bind = $mainMod, O,           exec,  ~/.config/hypr/scripts/open-if-not.sh obsidian
bind = $mainMod, Z,           exec,  ~/dotfiles/scripts/fzf-zathura
bind = $mainMod, X,           exec,  ~/dotfiles/scripts/fzf-imv
bind = $mainMod, A,           exec,  ~/dotfiles/scripts/fzf-neovide
bind = $mainMod, page_down,   exec,  kitty --class=calc tmux new-session qalc
bind = $mainMod, R,           exec,  rofi -show drun -no-fixed-num-lines
bind = $mainMod, Delete,           exec,  rofi -show run -no-fixed-num-lines
bind = $mainMod, Y,           exec,  ~/.config/hypr/scripts/WallpaperSelect.sh
bind = $mainMod, T,           exec,  ~/.config/hypr/scripts/status.sh
bind = $mainMod SHIFT, F,     exec,  pcmanfm
bind = $mainMod, S,           exec,  ~/.config/hypr/scripts/hyprshot.sh "simple"
bind = , code:107,            exec,  ~/.config/hypr/scripts/hyprshot.sh "screen" # 107 is the print screen button
bind = $mainMod SHIFT, S,     exec,  ~/.config/hypr/scripts/hyprshot.sh
bind = $mainMod SHIFT, T,     exec,  ~/.config/hypr/scripts/get-text.sh
bind = $mainMod SHIFT, C,     exec,  hyprpicker -a
bind = $mainMod, period,      exec,  rofi -config ~/.config/rofi/config-copy.rasi -modi emoji -show emoji -no-fixed-num-lines -lines 20
bind = $mainMod, dead_grave,  exec,  ~/.config/hypr/scripts/vim-scratch.sh zxcv
bind = $mainMod, F10,         exec,  ~/.config/hypr/scripts/vim-scratch.sh faire

bind = CONTROL SHIFT, o, exec, wtype -M shift ] -m shift


# ==== WORKSPACES ====
bind = $mainMod, numbersign, togglespecialworkspace, specialwork
bind = $mainMod SHIFT, numbersign, movetoworkspace, special:specialwork

bind = $mainMod, slash,              workspace, 1
bind = $mainMod, parenleft,          workspace, 2
bind = $mainMod, bracketleft,        workspace, 3
bind = $mainMod, braceleft,          workspace, 4
bind = $mainMod, dead_circumflex,    workspace, 5
bind = $mainMod, dollar,             workspace, 6
bind = $mainMod, exclam,             exec,      ~/.config/hypr/scripts/spawn-if-empty.sh 7 thunderbird
bind = $mainMod, braceright,         exec,      ~/.config/hypr/scripts/spawn-if-empty.sh 8 vesktop
bind = $mainMod, bracketright,       exec,      ~/.config/hypr/scripts/spawn-if-empty.sh 9 element-desktop
bind = $mainMod, parenright,         workspace, 10

bind = $mainMod, F1, workspace, 6
bind = $mainMod, F2, exec,      ~/.config/hypr/scripts/spawn-if-empty.sh 7 thunderbird
bind = $mainMod, F3, exec,      ~/.config/hypr/scripts/spawn-if-empty.sh 8 vesktop
bind = $mainMod, F4, exec,      ~/.config/hypr/scripts/spawn-if-empty.sh 9 element-desktop

bind = $mainMod SHIFT, slash,              movetoworkspace, 1
bind = $mainMod SHIFT, parenleft,          movetoworkspace, 2
bind = $mainMod SHIFT, bracketleft,        movetoworkspace, 3
bind = $mainMod SHIFT, braceleft,          movetoworkspace, 4
bind = $mainMod SHIFT, dead_circumflex,    movetoworkspace, 5
bind = $mainMod SHIFT, dollar,             movetoworkspace, 6
bind = $mainMod SHIFT, exclam,             movetoworkspace, 7
bind = $mainMod SHIFT, braceright,         movetoworkspace, 8
bind = $mainMod SHIFT, bracketright,       movetoworkspace, 9
bind = $mainMod SHIFT, parenright,         movetoworkspace, 10

bind = $mainMod SHIFT, F1, movetoworkspace, 6
bind = $mainMod SHIFT, F2, movetoworkspace, 7
bind = $mainMod SHIFT, F3, movetoworkspace, 8
bind = $mainMod SHIFT, F4, movetoworkspace, 9

bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1

bind = $mainMod CONTROL, left, workspace, -1
bind = $mainMod CONTROL, right, workspace, +1
bind = $mainMod SHIFT, left, movetoworkspace, -1
bind = $mainMod SHIFT, right, movetoworkspace, +1

# ==== Window ====
bind = $mainMod, h, movefocus, l
bind = $mainMod, i, movefocus, r
bind = $mainMod, e, movefocus, u
bind = $mainMod, n, movefocus, d

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, n, movewindow, d
bind = $mainMod SHIFT, e, movewindow, u
bind = $mainMod SHIFT, i, movewindow, r

bind = $mainMod SHIFT CONTROL, h, movewindoworgroup, l
bind = $mainMod SHIFT CONTROL, n, movewindoworgroup, d
bind = $mainMod SHIFT CONTROL, e, movewindoworgroup, u
bind = $mainMod SHIFT CONTROL, i, movewindoworgroup, r

# binde = $mainMod SHIFT, k, resizeactive, -20 0
# binde = $mainMod SHIFT, m, resizeactive, 20 0
#
# bindm = $mainMod, CONTROL_L, movewindow
#bindm = $mainMod SHIFT, CONTROL_L, resizewindow

# bindm = $mainMod, CONTROL_L,     resizewindow
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==== Groups ====
bind = $mainMod, G, togglegroup
bind = ALT, G, moveoutofgroup
bind = $mainMod ALT, u, changegroupactive, f
bind = $mainMod ALT, l, changegroupactive, b
bind = $mainMod ALT, k, movegroupwindow, b
bind = $mainMod ALT, m, movegroupwindow, f

# ==== Sound and brightness ====
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ && ~/.config/hypr/scripts/volume-dunst.sh
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- && ~/.config/hypr/scripts/volume-dunst.sh
bindel = $mainMod, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/volume-dunst.sh

bindel = , XF86MonBrightnessUp, exec, brightnessctl -e s 2%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e s 2%-

# ==== Media control ====
bindl = , XF86AudioNext, exec,  playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec,  playerctl play-pause
bindl = , XF86AudioPrev, exec,  playerctl previous
bindl = , XF86AudioMute, exec,  playerctl play-pause
bind = $mainMod, page_up, exec, ~/.config/hypr/scripts/change-sound-output.sh
